project:
  type: book
  output-dir: docs

lang: pt-PT
bibliography: referencias.bib
filters:
  - filters/httpmsg-latex.lua

book:
  title: "Criptografia"
  subtitle: "Módulo de Cibersegurança — Mestrado em Engenharia Eletrotécnica e de Computadores"
  author:
    - name: "João Pavão"
      affiliation: "Universidade de Trás-os-Montes e Alto Douro"
  date: "2026-09-14"

  chapters:
    - index.qmd
    - capitulos/cap01.qmd
    - capitulos/cap02.qmd
    - capitulos/cap03.qmd
    - capitulos/cap04.qmd
    - capitulos/cap05.qmd
    - capitulos/cap06.qmd
    - capitulos/cap07.qmd
    - capitulos/cap08.qmd
    - capitulos/cap09.qmd
    - capitulos/cap10.qmd
    - capitulos/cap11.qmd

  sidebar:
    search: true
    tools:
      - icon: translate
        href: /en/
        text: "English version"

  page-footer:
    left: "Criptografia — Cibersegurança, UTAD"

format:
  html:
    theme:
        light: litera
        dark: darkly
    css: assets/css/custom.css
    toc: true
    toc-depth: 3
    smooth-scroll: true
    number-sections: true
    number-depth: 3
    highlight-style: github
    code-fold: false
    code-tools: true
    fig-align: center

  pdf:
    documentclass: scrbook
    classoption: [oneside]
    papersize: a4
    fontsize: 11pt
    toc: true
    toc-depth: 3
    number-sections: true
    colorlinks: true
    linkcolor: "NavyBlue"
    urlcolor: "NavyBlue"
    geometry:
      - top=2.5cm
      - bottom=2.5cm
      - left=3cm
      - right=2.5cm
    include-in-header:
      text: |
        \AtBeginDocument{\input{assets/cover.tex}}
        \usepackage{booktabs}
        \usepackage{longtable}
        \usepackage{array}
        \usepackage{multirow}
        \usepackage{amssymb}
        \usepackage{amsmath}
        \usepackage{caption}
        \captionsetup{font=small, labelfont=bf}
        \everydisplay\expandafter{\the\everydisplay\small}
        \makeatletter
        \let\Pandoc@MathOpen\(
        \let\Pandoc@MathClose\)
        \def\({\begingroup\small\Pandoc@MathOpen}
        \def\){\Pandoc@MathClose\endgroup}
        \makeatother
        \usepackage{etoolbox}
        \AtBeginEnvironment{longtable}{\footnotesize\renewcommand{\arraystretch}{0.65}\setlength{\tabcolsep}{5pt}}
        \usepackage{xcolor}
        \usepackage{tikz}
        \usepackage{framed}
        \definecolor{httpmsgbg}{HTML}{f2f3f4}
        \definecolor{httpmsgborder}{HTML}{c3cacd}
        \makeatletter
        \def\FrameCommand{\fboxsep=8pt\fcolorbox{httpmsgborder}{httpmsgbg}}
        \makeatother
        \newenvironment{httpmsg}{%
          \footnotesize\ttfamily
          \begin{framed}
        }{%
          \end{framed}
        }
        \definecolor{coverDark}{HTML}{1a0505}
        \definecolor{coverAccent}{HTML}{b0202a}
        \definecolor{coverLight}{HTML}{e2434f}
        \definecolor{chapbg}{HTML}{fbe4e4}
        \definecolor{chapnum}{HTML}{7a1015}
        \definecolor{chaptxt}{HTML}{2a0808}
        \KOMAoption{chapterprefix}{false}
        \makeatletter
        \renewcommand{\chapterlinesformat}[3]{%
          {\setlength{\fboxsep}{12pt}%
          \noindent\colorbox{chapbg}{%
            \parbox[c][5cm]{\dimexpr\linewidth-2\fboxsep\relax}{%
              \def\@chnum{#2}%
              \ifx\@chnum\@empty%
                {\raggedright\hyphenpenalty=10000\exhyphenpenalty=10000\color{chaptxt}\huge\bfseries #3}%
              \else%
                \begin{minipage}[c]{3cm}%
                  \centering\color{chapnum}\fontsize{104}{104}\selectfont\bfseries #2%
                \end{minipage}%
                \hspace{10pt}%
                \begin{minipage}[c]{\dimexpr\linewidth-2\fboxsep-3cm-10pt\relax}%
                  \raggedright\hyphenpenalty=10000\exhyphenpenalty=10000\color{chaptxt}\fontsize{20}{24}\selectfont\bfseries #3%
                \end{minipage}%
              \fi%
            }%
          }}%
        }
        \makeatother
    pdf-engine: lualatex

execute:
  echo: true
  warning: false
  message: false
